name: TradeFlow Swing Scanner

on:
  schedule:
    # Odd minutes reduce queue congestion slightly, though external workflow_dispatch is strongly recommended
    # 05:37 UTC = 11:07 AM IST (Mon-Fri) -> Morning Momentum Scan
    - cron: '37 5 * * 1-5'
    # 09:33 UTC = 3:03 PM IST (Mon-Fri) -> Pre-Close / BTST Scan
    - cron: '33 9 * * 1-5'
    # 13:32 UTC = 7:02 PM IST (Mon-Fri) -> EOD Session + Confirmed FII/DII Release
    - cron: '32 13 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "scanner/requirements.txt" ]; then
            pip install -r scanner/requirements.txt
          else
            echo "ERROR: requirements.txt not found!" >&2
            exit 1
          fi

      - name: Execute Swing Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "swing_scanner.py" ]; then
            python swing_scanner.py
          elif [ -f "scanner/swing_scanner.py" ]; then
            python scanner/swing_scanner.py
          else
            echo "ERROR: swing_scanner.py not found!" >&2
            exit 1
          fi
