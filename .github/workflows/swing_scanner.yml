name: TradeFlow Swing Scanner

on:
  schedule:
    # 05:35 UTC = 11:05 AM IST (Monday - Friday) -> Morning Momentum Scan
    - cron: '35 5 * * 1-5'
    # 09:35 UTC = 3:05 PM IST (Monday - Friday) -> Pre-Close / BTST (Leaves 25 mins before close)
    - cron: '35 9 * * 1-5'
    # 12:05 UTC = 5:35 PM IST (Monday - Friday) -> EOD Complete Session & FII/DII Release
    - cron: '5 12 * * 1-5'
  # Allows manual 1-click trigger anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "scanner/requirements.txt" ]; then
            pip install -r scanner/requirements.txt
          fi

      - name: Execute Swing Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "swing_scanner.py" ]; then
            python swing_scanner.py
          elif [ -f "scanner/swing_scanner.py" ]; then
            python scanner/swing_scanner.py
          fi
