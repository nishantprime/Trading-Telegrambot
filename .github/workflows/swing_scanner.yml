name: TradeFlow Swing Scanner

on:
  schedule:
    # 09:45 UTC = 3:15 PM IST (Monday - Friday) -> Pre-Close / BTST Entry Window
    - cron: '45 9 * * 1-5'
    # 12:00 UTC = 5:30 PM IST (Monday - Friday) -> EOD Complete Session & FII/DII Release
    - cron: '0 12 * * 1-5'
  # Allows manual 1-click trigger anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt

      - name: Execute Swing Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner/swing_scanner.py
