name: TradeFlow Swing Scanner

on:
  schedule:
    # Odd minutes reduce top-of-hour GitHub Actions queue congestion
    # 05:37 UTC = 11:07 AM IST (Mon-Fri) -> Morning Momentum Scan
    - cron: '37 5 * * 1-5'
    # 09:33 UTC = 3:03 PM IST (Mon-Fri) -> Pre-Close / BTST Scan
    - cron: '33 9 * * 1-5'
    # 13:32 UTC = 7:02 PM IST (Mon-Fri) -> EOD Session + Confirmed FII/DII Release
    - cron: '32 13 * * 1-5'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Optional session mode override (auto, MORNING, BTST, EOD)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - MORNING
          - BTST
          - EOD

concurrency:
  group: tradeflow-swing-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "scanner/requirements.txt" ]; then
            pip install -r scanner/requirements.txt
          else
            echo "requirements.txt not found — installing core scanner packages..."
            pip install yfinance pandas numpy requests
          fi

      - name: Compute IST Date for Daily State Cache
        id: ist_date
        run: |
          echo "today=$(TZ='Asia/Kolkata' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Same-Day Scanner State
        uses: actions/cache/restore@v5
        with:
          path: .scanner_cache
          key: tradeflow-state-${{ steps.ist_date.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            tradeflow-state-${{ steps.ist_date.outputs.today }}-

      - name: Execute Swing Scanner & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ inputs.scan_mode == 'auto' && '' || inputs.scan_mode }}
          SCANNER_STATE_PATH: .scanner_cache/state.json
        run: |
          if [ -f "swing_scanner.py" ]; then
            python swing_scanner.py
          elif [ -f "scanner/swing_scanner.py" ]; then
            python scanner/swing_scanner.py
          else
            echo "ERROR: swing_scanner.py not found!" >&2
            exit 1
          fi

      - name: Save Updated Scanner State
        if: always() && hashFiles('.scanner_cache/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .scanner_cache
          key: tradeflow-state-${{ steps.ist_date.outputs.today }}-${{ github.run_id }}
